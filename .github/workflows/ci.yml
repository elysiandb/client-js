name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Build and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Check that dist/ matches the sources
        run: git diff --exit-code -- dist

  integration:
    name: Integration tests (ElysianDB ${{ matrix.elysiandb }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        elysiandb: [v0.2.3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: false
      - name: Build ElysianDB
        env:
          ELYSIANDB_VERSION: ${{ matrix.elysiandb }}
        run: |
          git clone --depth 1 --branch "$ELYSIANDB_VERSION" https://github.com/elysiandb/elysiandb.git "$RUNNER_TEMP/elysiandb"
          cd "$RUNNER_TEMP/elysiandb"
          go build -ldflags "-X github.com/taymour/elysiandb/internal/globals.VERSION=${ELYSIANDB_VERSION#v}" -o "$RUNNER_TEMP/elysiandb-bin" .
      - name: Start ElysianDB servers
        run: scripts/start-test-servers.sh "$RUNNER_TEMP/elysiandb-bin" "$RUNNER_TEMP/servers"
      - run: npm ci
      - run: npm run test:integration:local
      - name: Server logs
        if: failure()
        run: tail -n 50 "$RUNNER_TEMP"/servers/*.log
